# Tema base del tablero (paleta oscura). El selector "Modo claro" de la barra lateral
# cambia estos mismos valores en caliente; acá queda la configuración de arranque.
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#151b23"
textColor = "#e6edf3"
font = "sans serif"

[browser]
gatherUsageStats = false
